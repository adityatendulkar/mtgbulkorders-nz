name: Build Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build app bundle
        run: python -m PyInstaller --clean desktop.spec
      - name: Build DMG
        run: |
          hdiutil create \
            -volname "Card Optimiser" \
            -srcfolder "dist/CardOptimiser.app" \
            -ov \
            -format UDZO \
            "dist/CardOptimiser-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: CardOptimiser-mac
          path: |
            dist/CardOptimiser.app
            dist/CardOptimiser-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --clean desktop_windows.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CardOptimiser-windows
          path: |
            dist/CardOptimiser.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CardOptimiser-mac
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: CardOptimiser-windows
          path: release-assets/windows
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/macos/CardOptimiser-mac.dmg
            release-assets/windows/CardOptimiser.exe
